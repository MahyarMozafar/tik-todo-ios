name: Tik

options:
  bundleIdPrefix: com.mahyarmozafar
  deploymentTarget:
    iOS: "27.0"
  developmentLanguage: en
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES

targets:
  Tik:
    type: application
    platform: iOS
    sources:
      - path: Tik
      - path: Shared
    dependencies:
      - target: TikWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mahyarmozafar.tik
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: AppIcon-Midnight AppIcon-Light AppIcon-Mint AppIcon-Purple AppIcon-Sunset
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: Tik/Info.plist
      properties:
        CFBundleDisplayName: Tik
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleURLTypes:
          - CFBundleURLName: com.mahyarmozafar.tik
            CFBundleURLSchemes:
              - tik
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIAppFonts:
          - Vazirmatn-Regular.ttf
          - Vazirmatn-Medium.ttf
          - Vazirmatn-SemiBold.ttf
          - Vazirmatn-Bold.ttf
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    entitlements:
      path: Tik/Tik.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.mahyarmozafar.tik
    scheme:
      testTargets:
        - TikUITests

  TikWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: TikWidget
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mahyarmozafar.tik.widget
        SKIP_INSTALL: YES
    info:
      path: TikWidget/Info.plist
      properties:
        CFBundleDisplayName: Tik
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        UIAppFonts:
          - Vazirmatn-Regular.ttf
          - Vazirmatn-Medium.ttf
          - Vazirmatn-SemiBold.ttf
          - Vazirmatn-Bold.ttf
    entitlements:
      path: TikWidget/TikWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.mahyarmozafar.tik

  TikUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: TikUITests
    dependencies:
      - target: Tik
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mahyarmozafar.tik.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Tik
